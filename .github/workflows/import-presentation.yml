name: Import approved presentation assets
on:
  push:
    paths: ['.github/workflows/import-presentation.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the approved public artifacts
        run: |
          curl --fail --location --retry 3 'https://events.fomichev.music/wine27-presentation-transfer-20261104/assets-v16.tar.gz' -o /tmp/assets.tar.gz
          echo '09f6ed0adda47c4ab035ecb8a607346aebd6aabddadf4463933e12253adc680e  /tmp/assets.tar.gz' | sha256sum -c -
          python3 - <<'PYTHON'
          import tarfile
          with tarfile.open('/tmp/assets.tar.gz') as tar:
              for item in tar.getmembers():
                  assert item.isfile() and item.name.startswith('presentation/assets/') and '..' not in item.name.split('/')
                  assert item.name.endswith(('.pdf','.jpg'))
              tar.extractall('.',filter='data')
          PYTHON
          echo '2ec3b204b7ab0f6bf669b73c993166bc7d694199f5d81f3cd5a7cda85bb20948  presentation/assets/BelyiMys_Season_2027_v16.pdf' | sha256sum -c -
      - name: Save artifacts without changing the current calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation/assets
          git commit -m 'Approve cabaret June–December in presentation v16'
          git push origin HEAD:main
