name: Design QA and version stamp
on:
  push:
    branches: [design/brand-atlas-2027]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and stamp
        run: |
          python3 scripts/stamp-version.py
          node --check app.js
          node --check load.js
          node --check auto-update.js
          node scripts/check-calendar.cjs
          git diff --check
      - name: Save checked release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site-version.json
          if ! git diff --cached --quiet; then
            git commit -m "Stamp checked brand calendar release"
            git push origin HEAD:design/brand-atlas-2027
          fi
          cat site-version.json
